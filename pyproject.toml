[project]
name = "juvant-tools"
version = "0.2.0"
description = "Utility scripts and dev tools for the Juvant OS ecosystem (juvantlabs/*)"
authors = [{name = "Juvant Srls"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
juvant-tools = "juvant_tools.cli:cli"

[project.urls]
Homepage = "https://github.com/juvantlabs/juvant-tools"
Repository = "https://github.com/juvantlabs/juvant-tools"
"Handbook" = "https://github.com/juvantlabs/handbook"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juvant_tools"]

[tool.hatch.build]
include = [
    "juvant_tools/**/*.py",
    "juvant_tools/**/*.j2",
    "juvant_tools/**/templates/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
